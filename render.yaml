services:
  - type: web
    name: roomie555-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: starter
    disk:
      name: roomie-auth
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ROOMIE_DB_PATH
        value: /var/data/auth.db
      - key: CORS_ORIGINS
        value: https://roomie555.netlify.app
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
